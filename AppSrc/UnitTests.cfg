; UnitTests.cfg - project settings for the DFUnit test program.
;
; Platform=x86: COM Manifest Studio itself is a 32-bit program (it has to be, to talk to the COM
; components), so its tests run as 32-bit too. The program is UnitTests.exe.
; The manifest is a fixed file kept with the source, UnitTests.exe.manifest: it is embedded
; (EmbedManifestFile=1) but never written (BuildManifestFile=0). df-cli does not write a
; manifest, so a written one would be missing on a build server ("manifest file cannot be
; found"); the fixed one is there for the Studio and df-cli alike, and gives the test-runner
; window the new common controls.
; Icon is the icon of the program file. The test-runner window brings its own images.
[Application]
IsWebApp=0
BuildManifestFile=0
EmbedManifestFile=1
DPIAware=1
AutoGenerateMenus=0
CompilerWarnings=1
Icon=UnitTesting.ico
[Compiler]
Platform=x86
64BitSuffix=64
32BitSuffix=
BeforeCompileProcessEnabled=0
AfterCompileProcessEnabled=0
[Version]
Include=0
AutoIncrementBuild=0
